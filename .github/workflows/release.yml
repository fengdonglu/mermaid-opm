name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build --workspaces --if-present
      - name: Package VSIX
        working-directory: packages/vscode-opm
        run: npx --yes @vscode/vsce package --no-dependencies
      - name: Attach VSIX to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: packages/vscode-opm/*.vsix
          generate_release_notes: true
