<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mermaid-opm — OPL playground</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
    header { padding: 16px 24px; border-bottom: 1px solid #8884; position: sticky; top: 0; background: Canvas; z-index: 10; }
    header h1 { margin: 0 0 4px; font-size: 20px; }
    header p { margin: 0; opacity: 0.75; }
    header a { color: inherit; }
    .header-actions { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 4px; }
    .repo-link { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; font-size: 13px; opacity: 0.8; }
    .repo-link:hover { opacity: 1; }
    .repo-link svg { width: 18px; height: 18px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 24px; border-bottom: 1px solid #8884; position: sticky; top: 72px; background: Canvas; z-index: 9; }
    .toolbar label { font-size: 13px; opacity: 0.8; }
    .toolbar select, .toolbar button { font: inherit; padding: 5px 9px; border: 1px solid #8884; border-radius: 6px; background: transparent; cursor: pointer; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; align-items: stretch; }
    .panel { border: 1px solid #8884; border-radius: 8px; padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; }
    .panel h2 { margin: 0 0 8px; font-size: 15px; opacity: 0.8; font-weight: 600; }
    textarea { flex: 1; width: 100%; min-height: 360px; resize: vertical; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 10px; border-radius: 6px; border: 1px solid #8884; background: #8881; }
    #view { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; min-height: 360px; }
    #view svg { max-width: 100%; height: auto; }
    .diagnostics { margin: 0 24px 32px; border: 1px solid #8884; border-radius: 8px; padding: 10px 14px; }
    .diagnostics h2 { margin: 0 0 6px; font-size: 15px; opacity: 0.8; font-weight: 600; }
    .diagnostics ul { margin: 0; padding-left: 18px; }
    .diagnostics li { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .severity-error { color: #c0392b; }
    .severity-warning { color: #b7791f; }
    .ok { opacity: 0.7; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } .toolbar { top: 0; } }
  </style>
</head>
<body>
  <header>
    <div class="header-actions">
      <a class="repo-link" href="https://github.com/fengdonglu/mermaid-opm" aria-label="GitHub repository" title="GitHub repository">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>fengdonglu/mermaid-opm</span>
      </a>
    </div>
    <h1>OPL playground</h1>
    <p>Type Object-Process Language on the left; the Object-Process Diagram and diagnostics update live. See the <a href="./index.html">gallery</a> for the Mermaid-plugin usage.</p>
  </header>
  <div class="toolbar">
    <label for="samples">Examples</label>
    <select id="samples"></select>
    <button id="download" type="button">Download SVG</button>
    <button id="copy" type="button">Copy SVG</button>
    <button id="clear" type="button">Clear</button>
  </div>
  <main>
    <section class="panel">
      <h2>OPL source</h2>
      <textarea id="editor" spellcheck="false" aria-label="OPL source"></textarea>
    </section>
    <section class="panel">
      <h2>Rendered OPD</h2>
      <div id="view"></div>
    </section>
  </main>
  <section class="diagnostics" aria-live="polite">
    <h2>Diagnostics</h2>
    <div id="diagnostics" class="ok">No diagnostics.</div>
  </section>
  <script type="module">
    import { renderSvg, renderModel } from '../dist/mermaid-opm.mjs';
    import examples from './examples.mjs';

    const editor = document.getElementById('editor');
    const view = document.getElementById('view');
    const diagEl = document.getElementById('diagnostics');
    const samplesEl = document.getElementById('samples');

    let timer = 0;
    let lastSvg = '';

    function showDiagnostics(diagnostics) {
      if (diagnostics.length === 0) {
        diagEl.className = 'ok';
        diagEl.textContent = 'No diagnostics.';
        return;
      }
      diagEl.className = '';
      diagEl.innerHTML = '<ul></ul>';
      const ul = diagEl.querySelector('ul');
      for (const d of diagnostics) {
        const li = document.createElement('li');
        li.className = `severity-${d.severity}`;
        li.textContent = `${d.severity}: ${d.code} @${d.line}:${d.column} ${d.message}`;
        ul.appendChild(li);
      }
    }

    function render() {
      const source = editor.value;
      if (!source.trim()) {
        view.innerHTML = '';
        lastSvg = '';
        showDiagnostics([]);
        return;
      }
      try {
        view.innerHTML = renderSvg(source);
        lastSvg = view.innerHTML;
        showDiagnostics(renderModel(source).diagnostics);
      } catch (e) {
        view.innerHTML = '';
        lastSvg = '';
        showDiagnostics([{ severity: 'error', code: 'render-failed', message: String(e.message || e), line: 1, column: 1 }]);
      }
    }

    function scheduleRender() {
      clearTimeout(timer);
      timer = setTimeout(render, 300);
    }

    editor.addEventListener('input', scheduleRender);

    for (let i = 0; i < examples.length; i++) {
      const opt = document.createElement('option');
      opt.value = examples[i].sample;
      opt.textContent = `${String(i + 1).padStart(2, '0')} · ${examples[i].title}`;
      samplesEl.appendChild(opt);
    }

    samplesEl.addEventListener('change', async () => {
      const text = await (await fetch(`./samples/${samplesEl.value}`)).text();
      editor.value = text;
      render();
    });

    document.getElementById('download').addEventListener('click', () => {
      if (!lastSvg) return;
      const url = URL.createObjectURL(new Blob([lastSvg], { type: 'image/svg+xml' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'opd.svg';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('copy').addEventListener('click', () => {
      if (lastSvg && navigator.clipboard) navigator.clipboard.writeText(lastSvg);
    });

    document.getElementById('clear').addEventListener('click', () => {
      editor.value = '';
      render();
    });

    (async () => {
      const text = await (await fetch(`./samples/${examples[0].sample}`)).text();
      editor.value = text;
      samplesEl.value = examples[0].sample;
      render();
    })();
  </script>
</body>
</html>
